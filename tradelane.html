<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TradeLane — Sell Your Car the Easy Way</title>
    <meta name="description" content="Thinking of selling your car? Get a free, no-obligation estimate from a local team that pays fairly and makes selling simple." />
    <meta name="theme-color" content="#044A7E" />
    <link rel="icon" type="image/svg+xml" href="/tradelane-logo.svg" />

    <!-- Open Graph (link previews when shared) -->
    <meta property="og:title" content="What's your car actually worth?" />
    <meta property="og:description" content="A free estimate built from cars actually listed near you — not a lowball anchor. Takes about a minute." />
    <meta property="og:type" content="website" />
    <!-- Without an image, a link shared in an Instagram DM or story renders as
         a bare grey box, which is the difference between being tapped and
         ignored. 1200x630 is the size every platform crops from. -->
    <meta property="og:image" content="https://tradelane.ca/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://tradelane.ca/" />
    <meta property="og:site_name" content="TradeLane" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="What's your car actually worth?" />
    <meta name="twitter:description" content="A free estimate built from cars actually listed near you. No obligation." />
    <meta name="twitter:image" content="https://tradelane.ca/og-image.png" />

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; -webkit-font-smoothing: antialiased; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/tradelane.jsx"></script>
  </body>
</html>
