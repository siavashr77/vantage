<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TradeLane — Sell Your Car the Easy Way</title>
    <meta name="description" content="Thinking of selling your car? Get a free, no-obligation estimate from a local team that pays fairly and makes selling simple." />
    <meta name="theme-color" content="#044A7E" />
    <link rel="icon" type="image/svg+xml" href="/tradelane-logo.svg" />

    <!-- ── Advertising tags ────────────────────────────────────────────
         This file is the TradeLane build entry: scripts/site-target.mjs only
         promotes it to dist/index.html when SITE_TARGET=tradelane, so these
         tags ship on tradelane.ca and never on the Vantage dealer app.

         The Google Ads ID is a public identifier and is safe in source. The
         Meta pixel is read from VITE_META_PIXEL_ID at build time so it can be
         switched on later by setting one Netlify variable — no code change.
         Vite leaves the %VITE_...% token untouched when the variable is unset,
         which is what the '%' check below detects. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18401659980"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'AW-18401659980');

      (function () {
        var metaId = '%VITE_META_PIXEL_ID%';
        // Unset builds leave the literal token in place; treat that as "off".
        if (!metaId || metaId.indexOf('%') !== -1) return;
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
        (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', metaId);
        fbq('track', 'PageView');
      })();
    </script>

    <!-- Open Graph (link previews when shared) -->
    <meta property="og:title" content="What's your car actually worth?" />
    <meta property="og:description" content="A free estimate built from cars actually listed near you — not a lowball anchor. Takes about a minute." />
    <meta property="og:type" content="website" />
    <!-- Without an image, a link shared in an Instagram DM or story renders as
         a bare grey box, which is the difference between being tapped and
         ignored. 1200x630 is the size every platform crops from. -->
    <meta property="og:image" content="https://tradelane.ca/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://tradelane.ca/" />
    <meta property="og:site_name" content="TradeLane" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="What's your car actually worth?" />
    <meta name="twitter:description" content="A free estimate built from cars actually listed near you. No obligation." />
    <meta name="twitter:image" content="https://tradelane.ca/og-image.png" />

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; -webkit-font-smoothing: antialiased; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/tradelane.jsx"></script>
  </body>
</html>
