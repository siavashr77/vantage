[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — also covered by public/_redirects, kept here as a backstop.
# Per-site root selection is handled at build time by scripts/site-target.mjs
# (SITE_TARGET=tradelane on the consumer site replaces index.html), since
# Netlify redirect rules don't support Host-based conditions.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
